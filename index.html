<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script defer src="script.js"></script>
</head>
<body>
    <h2>Rock Paper Scissors</h2>
    <div id="game-buttons">
        <button id="rock" class="game-button" value="rock">Rock</button>
        <button id="paper" class="game-button" value="paper">Paper</button>
        <button id="scissors" class="game-button" value="scissors">Scissors</button>
    </div>
    <div id="display">
        <p id="scores" class="display-text"></p>
        <p id="commentary" class="display-text">New Game</p>
    </div>
</body>
</html>
